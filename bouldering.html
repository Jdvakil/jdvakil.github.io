        .climb-hero {
            position: relative;
            min-height: clamp(360px, 58vh, 560px);
            display: flex;
            align-items: flex-end;
            overflow: clip;
            isolation: isolate;
        }

        .climb-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -2;
            background: url('media/web/bouldering-bg.webp') center 60% / cover no-repeat;
            filter: saturate(0.9);
        }

        .climb-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgb(10 10 11 / 0.55) 0%, rgb(10 10 11 / 0.15) 28%, rgb(10 10 11 / 0.2) 55%, var(--bg) 100%);
        }

        /* Keep the nav legible while it sits on the photo. */
        .nav--photo:not(.is-scrolled) .brand,
        .nav--photo:not(.is-scrolled) .nav-link { color: rgb(255 255 255 / 0.92); }
        .nav--photo:not(.is-scrolled) .nav-link:hover { background: rgb(255 255 255 / 0.12); }
        .nav--photo:not(.is-scrolled) .icon-btn { color: #fff; border-color: rgb(255 255 255 / 0.35); }

        .climb-hero .container { padding-block: 120px 40px; }
        .climb-hero .label { color: rgb(255 255 255 / 0.75); }
        .climb-hero h1 { font-size: clamp(44px, 7vw, 88px); line-height: 0.95; letter-spacing: -0.045em; margin-top: 14px; color: #fff; }
        :root[data-theme-resolved='light'] .climb-hero h1 { color: var(--fg); }
        :root[data-theme-resolved='light'] .climb-hero .label { color: var(--fg-2); }

        .reels {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            padding-block: 32px 96px;
        }

        .reel {
            position: relative;
            aspect-ratio: 9 / 16;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: var(--media-bg);
            padding: 0;
            cursor: zoom-in;
        }

        .reel video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease); }
        .reel:hover video { transform: scale(1.03); }
        .reel-index { position: absolute; left: 12px; bottom: 12px; font: 500 11px/1 var(--mono); letter-spacing: 0.08em; color: rgb(255 255 255 / 0.85); text-shadow: 0 1px 8px rgb(0 0 0 / 0.5); }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            place-items: center;
            padding: clamp(16px, 4vw, 40px);
            background: rgb(5 5 6 / 0.88);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .lightbox.is-open { display: grid; }
        .lightbox video { max-width: min(92vw, 520px); max-height: 88vh; border-radius: 14px; background: #000; }
        .lightbox .icon-btn { position: fixed; top: 16px; right: 16px; color: #fff; border-color: rgb(255 255 255 / 0.3); }

        @media (max-width: 900px) {
            .reels { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        }

    <script>
        (function () {
            var box = document.querySelector('.lightbox');
            var player = box.querySelector('video');
            var closeBtn = box.querySelector('button');
            var opener = null;

            function close() {
                box.classList.remove('is-open');
                player.pause();
                player.removeAttribute('src');
                player.load();
                document.body.style.overflow = '';
                if (opener) opener.focus();
            }

            document.querySelectorAll('.reel').forEach(function (reel) {
                reel.addEventListener('click', function () {
                    opener = reel;
                    player.src = reel.dataset.src;
                    player.muted = false;
                    player.loop = true;
                    box.classList.add('is-open');
                    document.body.style.overflow = 'hidden';
                    player.play().catch(function () { });
                    closeBtn.focus();
                });
            });
            closeBtn.addEventListener('click', close);
            box.addEventListener('click', function (e) { if (e.target === box) close(); });
            window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && box.classList.contains('is-open')) close(); });
        })();
    </script>
